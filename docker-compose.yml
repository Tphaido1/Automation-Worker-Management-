services:
  db:
    image: postgres:16-alpine
    container_name: leaseflow-db
    environment:
      POSTGRES_USER: leaseflow
      POSTGRES_PASSWORD: leaseflow_secret
      POSTGRES_DB: leaseflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaseflow -d leaseflow_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaseflow-api
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://leaseflow:leaseflow_secret@db:5432/leaseflow_db
      - ENVIRONMENT=production
      - REQUIRE_API_KEY=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaseflow-worker
    command: ["python", "-m", "app.worker.runner"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://leaseflow:leaseflow_secret@db:5432/leaseflow_db
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # Services for Phase 7 (Observability)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: leaseflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: leaseflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning
    profiles:
      - monitoring
    depends_on:
      - prometheus

volumes:
  postgres_data:
