name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaseflow
          POSTGRES_PASSWORD: leaseflow_secret
          POSTGRES_DB: leaseflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint and format check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (Mypy)
        run: uv run mypy app

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://leaseflow:leaseflow_secret@localhost:5432/leaseflow_db
        run: uv run pytest -v
